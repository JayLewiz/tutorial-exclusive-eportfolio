<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jay Lewis</title>
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/fc60a2e8a9.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="landing-page">
      <nav>
        <figure>
          <img id="personal-logo" src="./assets/logo.svg" alt="" />
        </figure>
        <ul class="nav__link--list">
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >About</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Projects</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Contact</a
            >
          </li>

          <li class="nav__link click">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
            >
              <i class="fa-solid fa-circle-half-stroke"></i>
            </a>
          </li>
        </ul>
      </nav>
      <div class="container">
        <div class="row">
          <header class="header">
            <div class="header__content">
              <h1 class="title">Hey</h1>
              <h1 class="blue title">I'm Mr Lewis.</h1>
              <p class="header__para">
                I"m a <b class="blue">Frontend Software Engineer</b>
                with a strong passion for building web applications with great
                user experiences.
                <br />
                Here's a bit more <b class="blue">about me.</b>
              </p>
              <div class="social__list">
                <a
                  href="https://www.linkedin.com"
                  target="_blank"
                  class="social__link click"
                >
                  <i class="fa-brands fa-square-linkedin"></i>
                </a>
                <a
                  href="https://www.github.com"
                  target="_blank"
                  class="social__link click"
                >
                  <i class="fa-brands fa-github"></i>
                </a>
                <a
                  href="./assets/David Bragg Resume.pdf"
                  download=""
                  target="_blank"
                  class="social__link click"
                >
                  <i class="fa-regular fa-file-pdf"></i>
                </a>
              </div>
            </div>
          </header>
        </div>
      </div>
    </section>
  </body>
</html>
